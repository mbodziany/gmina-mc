# XcodeGen project definition. Run `xcodegen generate` in this folder to create
# GminaMC.xcodeproj, then open it in Xcode. Set DEVELOPMENT_TEAM below first.
name: GminaMC
options:
  bundleIdPrefix: xyz.mikebravo.gminamc
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # 👇 Put your Apple Developer Team ID here (Xcode > Settings > Accounts).
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"

targets:
  GminaMC:
    type: application
    platform: iOS
    sources:
      - Shared
      - iOSApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.mikebravo.gminamc
        INFOPLIST_FILE: iOSApp/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: "YES"
    entitlements:
      path: iOSApp/GminaMC.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.xyz.mikebravo.gminamc
    dependencies:
      - target: GminaMC Watch App
      - target: GminaMCWidget

  GminaMC Watch App:
    type: application
    platform: watchOS
    sources:
      - Shared
      - WatchApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.mikebravo.gminamc.watchkitapp
        INFOPLIST_FILE: WatchApp/Info.plist
        ENABLE_PREVIEWS: "YES"
    entitlements:
      path: WatchApp/GminaMCWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.xyz.mikebravo.gminamc
    dependencies:
      - target: GminaMC Watch Widget

  # iOS widget: home screen + Lock Screen families
  GminaMCWidget:
    type: app-extension
    platform: iOS
    sources:
      - Shared
      - iOSWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.mikebravo.gminamc.widget
        INFOPLIST_FILE: iOSWidget/Info.plist
        ENABLE_PREVIEWS: "YES"
    entitlements:
      path: iOSWidget/GminaMCWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.xyz.mikebravo.gminamc

  # watchOS complication (WidgetKit accessory families, incl. corner)
  GminaMC Watch Widget:
    type: app-extension
    platform: watchOS
    sources:
      - Shared
      - WatchWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.mikebravo.gminamc.watchkitapp.complication
        INFOPLIST_FILE: WatchWidget/Info.plist
        ENABLE_PREVIEWS: "YES"
    entitlements:
      path: WatchWidget/GminaMCWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.xyz.mikebravo.gminamc
