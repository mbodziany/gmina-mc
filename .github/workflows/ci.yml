name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  server:
    name: Backend (typecheck + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  plugin:
    name: Paper plugin (mvn package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B package
        working-directory: plugin
      # Ready-to-install jar — download from the Actions run summary,
      # no local Maven/PaperMC access needed.
      - uses: actions/upload-artifact@v4
        with:
          name: GminaMC-plugin
          path: plugin/target/GminaMC.jar
